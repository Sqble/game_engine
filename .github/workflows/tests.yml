name: Tests

on:
  push:
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            ninja-build \
            pkg-config \
            libglm-dev \
            libglfw3-dev \
            libepoxy-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxcursor-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build tests
        run: cmake --build build --target engine_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
